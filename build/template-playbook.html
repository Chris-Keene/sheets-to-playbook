<!-- v1.1.0 · built by build/build.py from a session file and playbook.config.json. Edit the template or the data, never this output. -->
<style>
/*FONTS*/
:root{
  --bg:#fbf9fe; --surface:#ffffff; --tint:#f4effa; --ink:#1d1326; --muted:#5b5168;
  --accent:#57258c; --on-accent:#ffffff; --logo:#57258c;
  --yellow:#ffd35d; --on-yellow:#1d1326;
  --band:#57258c; --on-band:#ffffff; --band-accent:#ffd35d; --band-ring-off:rgba(255,255,255,.28);
  --line:#e2d9ee; --ring-on:#57258c; --ring-off:#d9cfe6; --focus:#57258c; --dash:#7b6b91;
  --good:#1f6b45; --bad:#9b2335;
  --font:"Poppins", Arial, "Helvetica Neue", sans-serif;
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150e1d; --surface:#221830; --tint:#2a1e3a; --ink:#f1ecf7; --muted:#b5abc2;
    --accent:#c4a6ee; --on-accent:#150e1d; --logo:#f1ecf7;
    --band:#3b1863; --line:#3d2a52; --ring-on:#c4a6ee; --ring-off:#3d2a52; --focus:#ffd35d;
    --good:#7fd3a6; --bad:#ff9aa8; --dash:#9a86b8;
    color-scheme:dark;
  }
  :root:not([data-theme="light"]) .supporters .logo-light{display:none}
  :root:not([data-theme="light"]) .supporters .logo-dark{display:block}
}
:root[data-theme="dark"] .supporters .logo-light{display:none}
:root[data-theme="dark"] .supporters .logo-dark{display:block}
:root[data-theme="dark"]{
  --bg:#150e1d; --surface:#221830; --tint:#2a1e3a; --ink:#f1ecf7; --muted:#b5abc2;
  --accent:#c4a6ee; --on-accent:#150e1d; --logo:#f1ecf7;
  --band:#3b1863; --line:#3d2a52; --ring-on:#c4a6ee; --ring-off:#3d2a52; --focus:#ffd35d;
  --good:#7fd3a6; --bad:#ff9aa8; --dash:#9a86b8;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
/* the filters hide items with the hidden attribute; any author display rule (like .commit's grid) would beat the browser's */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--font);font-variant-numeric:lining-nums}
img,svg{max-width:100%}
a{color:var(--accent);text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
/* the page name, headings and main take focus only so screen readers land in the right place */
[tabindex="-1"]:focus{outline:none}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.5vw,2.75rem)}
h2{font-size:clamp(1.4rem,3vw,1.75rem)}
h3{font-size:1.125rem;font-weight:600;letter-spacing:0}
p{margin:0}
ul,ol{margin:0;padding:0}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:20px}
.read{max-width:44rem}
.eyebrow{font-size:.8125rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.skip{position:absolute;left:12px;top:-60px;background:var(--surface);color:var(--accent);padding:10px 14px;border-radius:6px;font-weight:600;z-index:10}
.skip:focus{top:12px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Example banner */
.example{background:var(--yellow);color:var(--on-yellow)}
.example .wrap{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding-block:10px;font-size:.9375rem}
.example strong{font-weight:700}

/* Header */
.site-head{border-bottom:1px solid var(--line);background:var(--surface)}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 28px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.brand svg{height:46px;width:auto;color:var(--logo);flex:none}
.brand span{font-size:.9375rem;font-weight:600;line-height:1.25}
.brand svg + span{padding-left:14px;border-left:1px solid var(--line)}  /* the divider only when there is a logo to divide from */
.nav ul{list-style:none;display:flex;flex-wrap:wrap;gap:4px}
.nav a{display:block;padding:8px 12px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.9375rem}
.nav a:hover{background:var(--tint)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* Hero */
.hero{background:var(--band);color:var(--on-band)}
.hero .wrap{display:grid;grid-template-columns:1fr;gap:32px;padding-block:48px 52px;align-items:center}
@media (min-width:820px){.hero .wrap{grid-template-columns:1fr 240px}}
.hero .eyebrow{color:var(--band-accent)}
.hero h1{margin-top:12px;max-width:18ch}
.hero .lede{margin-top:16px;font-size:1.125rem;max-width:40rem}
.hero .counts{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.hero .counts li{list-style:none;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:7px 14px;font-size:.875rem;font-variant-numeric:tabular-nums}
.hero .counts b{color:var(--band-accent);font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:24px;background:var(--band-accent);color:var(--on-yellow);border:0;border-radius:999px;padding:12px 20px;font:600 1rem var(--font);cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.05)}
.hero :focus-visible{outline-color:var(--band-accent)}
.hero-ring{justify-self:center;width:min(240px,60vw)}
.hero-ring svg{display:block;width:100%;height:auto}
@media (max-width:819px){.hero-ring{display:none}}
.hero-photo{margin:0}
.hero-photo img{display:block;width:100%;height:clamp(180px,24vw,400px);object-fit:cover;object-position:50% 62%}

/* Table ring glyph */
.ring path{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.ring .on{stroke:var(--ring-on)}
.ring .off{stroke:var(--ring-off)}
.ring text{fill:var(--ink);font:700 22px var(--font);text-anchor:middle;dominant-baseline:central}
.hero-ring .ring .on{stroke:var(--band-accent)}
.hero-ring .ring .off{stroke:var(--band-ring-off)}
.hero-ring .ring text{fill:var(--on-band);font-size:18px}
.hero-ring .ring .sub{font-size:7.5px;font-weight:500;letter-spacing:.06em}
@media (prefers-reduced-motion:no-preference){
  .hero-ring .ring g.arrow{animation:converge .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 45ms)}
  @keyframes converge{from{transform:rotate(var(--r)) translate(0,-44px)}to{transform:rotate(var(--r)) translate(0,-34px)}}
}

/* Sections */
main{display:block}
.section{padding-block:48px}
.section + .section{border-top:1px solid var(--line)}
.section-head{display:grid;gap:10px;margin-bottom:28px;max-width:44rem}

/* Themes */
.themes{list-style:none;display:grid;gap:4px}
.theme{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 16px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.theme > svg{grid-row:1 / span 3}
.theme > div,.theme .heard,.theme .go{grid-column:2}
.theme:last-child{border-bottom:0}
.theme .ring{width:64px;height:64px}
.theme .ring path{stroke-width:6}
.theme h3{font-size:1.0625rem}
.theme .tables{font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.theme .heard{margin-top:6px;font-size:.9375rem}
.theme .heard q{quotes:"\201C" "\201D"}
.theme .go{margin-top:6px;font-size:.9375rem;font-weight:500}
@media (min-width:760px){
  .theme{grid-template-columns:64px minmax(0,1fr) minmax(0,1.2fr);gap:4px 20px}
  .theme > div{grid-row:1 / span 3}
  .theme .heard,.theme .go{grid-column:3;margin-top:0}
}

/* Challenge cards */
.cards{list-style:none;display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:720px){.cards{grid-template-columns:1fr 1fr}.cards.odd>li:first-child{grid-column:1/-1}}
.card{position:relative;display:grid;gap:10px;align-content:start;height:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 18px}
.card:hover{border-color:var(--accent)}
.card:focus-within{outline:3px solid var(--focus);outline-offset:3px}
.card h3 a{color:var(--accent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.card h3 a::after{content:"";position:absolute;inset:0;border-radius:var(--radius)}
.card h3 a:focus-visible{outline:none}
.card .foot{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card .foot .ring{width:38px;height:38px;flex:none}
.card .foot .ring path{stroke-width:7}
/* People didn't realise the cards open (CAN forum, 19 Nov 2026), so each card says so. The cue is decoration: the title
   link names the card for assistive tech, and its ::after already makes the whole card clickable. */
.card .go{display:inline-flex;align-items:center;gap:8px;justify-self:start;margin-top:6px;padding:8px 14px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:.9375rem}
.card .go svg{width:18px;height:18px;flex:none}
.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.12)}
@media (prefers-reduced-motion:no-preference){
  .card{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .card:hover{transform:translateY(-2px)}
  .card .go svg{transition:transform .15s ease}
  .card:hover .go svg{transform:translateX(3px)}
}

/* Commitment cards */
.commits{list-style:none;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.commit{background:var(--yellow);color:var(--on-yellow);border-radius:6px;padding:20px 20px 16px;display:grid;gap:12px;align-content:space-between;min-height:140px}
.commit p{font-size:1.0625rem;font-weight:500;line-height:1.45}
.commit a{color:var(--on-yellow);font-size:.8125rem;font-weight:600}
.commit .tag{font-size:.8125rem;font-weight:500}
.more{margin-top:22px;font-weight:600}
.join{background:var(--band);color:var(--on-band)}
.join h2{color:var(--on-band)}
.join p{max-width:44rem;margin-top:10px}
.join .btn{margin-top:20px}

/* Challenge page */
.crumb{font-size:.9375rem;font-weight:500}
.page-head{display:grid;gap:14px;padding-block:36px 8px}
.page-head .meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;font-size:.9375rem;color:var(--muted)}
.page-head .meta .ring{width:56px;height:56px}
.page-head .meta .ring path{stroke-width:6}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none}
.chips li{background:var(--tint);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:.8125rem;font-weight:500}
.summary{font-size:1.125rem;max-width:44rem}
.quotes{display:grid;gap:18px;grid-template-columns:1fr;margin-block:28px 8px}
@media (min-width:720px){.quotes.two{grid-template-columns:1fr 1fr}}
.quote{margin:0;background:var(--tint);border-radius:var(--radius);padding:22px 24px}
.quote blockquote{margin:0;font-size:1.1875rem;font-weight:500;line-height:1.45}
.quote blockquote::before{content:"\201C";display:block;font-size:3rem;line-height:.8;height:.5em;color:var(--accent);font-weight:700}
.quote figcaption{margin-top:12px;font-size:.875rem;color:var(--muted)}
.block{padding-block:32px;border-top:1px solid var(--line)}
.block > h2{margin-bottom:18px}
.tried{display:grid;gap:24px;grid-template-columns:1fr}
@media (min-width:720px){.tried{grid-template-columns:1fr 1fr;gap:36px}}
.tried h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tried h3 svg{width:20px;height:20px;flex:none}
.tried .ok svg{color:var(--good)}
.tried .no svg{color:var(--bad)}
.tried ul{list-style:none;display:grid;gap:14px}
.tried li{padding-left:28px;position:relative}
.tried li::before{content:"";position:absolute;left:8px;top:.7em;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.learned{margin-top:36px}
.learned h3{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.learned h3 svg{width:20px;height:20px;flex:none;color:var(--accent)}
.lessons{list-style:none;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.lessons li{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--radius);padding:12px 16px;line-height:1.5}
section[aria-labelledby="kit-after"] > p + p{margin-top:12px}
.filter{border:0;padding:0;margin:0 0 18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.filter legend{float:left;margin-right:6px;font-size:.9375rem;font-weight:600;padding:0}
.filter label{position:relative;display:inline-flex}
.filter input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.filter span{display:block;padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:.9375rem;font-weight:500;background:var(--surface)}
.filter input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.filter input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.status{font-size:.875rem;color:var(--muted);margin-bottom:14px}
.actions{list-style:none;display:grid;gap:14px}
.action{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
.action h3{font-size:1.125rem}
.action dl{display:grid;grid-template-columns:1fr;gap:4px 18px;margin:12px 0 0}
@media (min-width:640px){.action dl{grid-template-columns:9.5rem 1fr}}
.action dt{font-size:.875rem;font-weight:600;color:var(--muted)}
.action dd{margin:0 0 8px}
@media (min-width:640px){.action dd{margin:0}}
.goodfor{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.goodfor > span{font-size:.8125rem;font-weight:600;color:var(--muted)}
.qlist{list-style:none;display:grid;gap:10px;max-width:44rem}
.qlist li{padding:12px 16px;border:1px dashed var(--muted);border-radius:var(--radius)}
.links{list-style:none;display:grid;gap:10px}
.links a{font-weight:500}
.links .src{display:block;font-size:.875rem;color:var(--muted)}
.links .nolink{font-weight:500}
.res-grid{list-style:none;padding:0;margin:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.res-card{position:relative;display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);transition:background-color .15s,border-color .15s}
.res-card:hover{background:var(--tint);border-color:var(--accent)}
.res-card:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.res-icon{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--accent)}
.res-card:hover .res-icon{background:var(--surface)}
.res-icon svg{width:24px;height:24px}
.res-body{min-width:0}
.res-card h3{font-size:1.0625rem;line-height:1.35;margin:0;overflow-wrap:anywhere}
.res-link{color:var(--ink);text-decoration:none}
.res-link:hover{text-decoration:underline;text-underline-offset:3px}
.res-link:focus-visible{outline:none}
.res-link::after{content:"";position:absolute;inset:0;border-radius:var(--radius)}
.res-meta,.res-from{margin:4px 0 0;font-size:.875rem;color:var(--muted)}
.res-from a{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.res-card{transition:none}}
.quotes.heard{list-style:none;margin-block:0;padding:0}
.quotes.heard > li{min-width:0}
@media (min-width:720px){.quotes.heard{grid-template-columns:1fr 1fr}}
.quotes.heard .quote{height:100%}
.pager{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px 8px;border-top:1px solid var(--line)}
.pager a{display:grid;gap:2px;text-decoration:none;max-width:22rem}
.pager a span{font-size:.8125rem;color:var(--muted);font-weight:500}
.pager a b{font-weight:600}
.pager .next{text-align:right;margin-left:auto}
.select{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:22px}
.select label{font-weight:600;font-size:.9375rem}
.select select{font:500 .9375rem var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--muted);border-radius:8px;padding:8px 12px;max-width:100%}
.steps{display:grid;gap:14px;max-width:44rem;padding-left:1.4em}
.steps li::marker{font-weight:700;color:var(--accent)}
.prose{display:grid;gap:14px;max-width:44rem}
.kit-hour{list-style:none;padding:0;display:grid;gap:14px;max-width:48rem;counter-reset:kh}
.kit-hour li{padding:16px 20px;border-left:4px solid var(--accent);background:var(--tint);border-radius:0 var(--radius) var(--radius) 0}
.kit-hour h3{font-size:1.0625rem}
.kit-hour .when{font-size:.875rem;font-weight:600;color:var(--muted);margin:2px 0 6px}
.kit-sheets{display:grid;gap:18px;grid-template-columns:1fr;margin-block:18px}
@media (min-width:820px){.kit-sheets{grid-template-columns:1fr 1fr}}
.kit-sheet{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.kit-sheet h3{margin:2px 0 10px}
.kit-sheet dt{font-weight:600;margin-top:8px}
.kit-sheet dd{margin:2px 0 0;color:var(--muted)}
.kit-prompts{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:720px){.kit-prompts{grid-template-columns:1fr 1fr}}
.kit-prompts ul{padding-left:1.2em;display:grid;gap:6px;margin-top:6px}
.note{font-size:.9375rem;color:var(--muted);max-width:48rem;margin-top:12px}
.kit-sub{margin-top:24px;font-size:1.0625rem}
.prose h2{margin-top:18px}

/* Empty slots (template and draft modes) */
.slot{border:2px dashed var(--dash);border-radius:var(--radius);padding:14px 16px;display:grid;gap:4px;align-content:start;background:transparent;color:var(--ink)}
.slot b{font-weight:600}
.slot > span:last-child{color:var(--muted);font-size:.9375rem;line-height:1.5}
.slot-tag{justify-self:start;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.slot-inline{display:inline-block;border:1.5px dashed var(--dash);border-radius:999px;padding:7px 12px;font-size:.8125rem;font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none}
.page-head > .slot{max-width:44rem}
.theme.is-slot > div{grid-column:2 / -1}
.tried li.is-slot{padding-left:0}
.tried li.is-slot::before{display:none}
.lesson-slot{margin-top:24px;max-width:44rem}
.action.is-slot{border:2px dashed var(--dash);background:transparent}
.action.is-slot dd{color:var(--muted)}
.action.is-slot .slot-tag{display:block;margin-bottom:6px}
.commit.is-slot{background:transparent;padding:0;min-height:0}
.commit.is-slot .slot{height:100%}
.card.is-empty{border-style:dashed;border-color:var(--dash)}
.src-tag{display:inline-block;margin-left:6px;padding:1px 7px;border:1px solid var(--accent);border-radius:4px;font-size:.75rem;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;vertical-align:.1em;white-space:nowrap}

/* Example marker, supporters, download */
.example-pill{margin:0;background:var(--yellow);color:var(--on-yellow);border-radius:999px;padding:7px 14px;font-size:.8125rem;font-weight:600}
.commit q{quotes:"\201C" "\201D" "\2018" "\2019"}
.commit .by{font-size:.875rem;font-weight:600;margin-top:-4px}
.supporters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;width:100%;padding-bottom:18px;border-bottom:1px solid var(--line)}
.supporters p{font-size:.8125rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.supporters ul{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.supporters a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;font-size:1rem;color:var(--ink);text-decoration:none}
.supporters a:hover{text-decoration:underline}
.supporters img{height:30px;width:auto;display:block}
.supporters .logo-dark{display:none}
.foot-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;width:100%}
.save-link{font:inherit;font-weight:600;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:.18em;cursor:pointer}
.save-btn{font:600 1rem var(--font);color:var(--on-accent);background:var(--accent);border:0;border-radius:999px;padding:12px 20px;cursor:pointer}
.save-status{width:100%}
.save-status:empty{display:none}

/* Footer */
.site-foot{border-top:1px solid var(--line);background:var(--surface);margin-top:48px}
.site-foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;padding-block:26px;font-size:.875rem;color:var(--muted)}
.site-foot a{font-weight:600}
/* a logo (or the credit's logo) in its own colours can have a second file for dark mode */
.brand-dark{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .brand-light{display:none}
  :root:not([data-theme="light"]) .brand-dark{display:inline-block}
}
:root[data-theme="dark"] .brand-light{display:none}
:root[data-theme="dark"] .brand-dark{display:inline-block}
.brand img{height:46px;width:auto;flex:none}
.brand img + span{padding-left:14px;border-left:1px solid var(--line)}
.credit{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.credit img{height:20px;width:auto}

@media print{
  .nav,.filter,.status,.skip,.btn,.hero-ring,#save{display:none!important}
  body{background:#fff;color:#000}
  .hero{background:#fff;color:#000}
  .action,.card,.quote{break-inside:avoid}
}
</style>
</head>
<body>
<p class="visually-hidden" id="page-name" tabindex="-1"></p>
<a class="skip" href="#main" id="skip">Skip to content</a>
<div id="banner"></div>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="#overview">
      <!--LOGO-->
      <span>Community<br>Playbook</span>
    </a>
    <nav class="nav" aria-label="Playbook">
      <ul>
        <li><a href="#overview" data-nav="overview">Playbook</a></li>
        <li><a href="#commitments" data-nav="commitments">Commitments</a></li>
        <li><a href="#kit" data-nav="kit">Run your own</a></li>
        <li><a href="#about" data-nav="about">How it was made</a></li>
      </ul>
    </nav>
  </div>
</header>
<main id="main" tabindex="-1">
  <noscript><div class="wrap section"><p>This playbook needs JavaScript to display. Please turn it on, or ask the organisers for a copy.</p></div></noscript>
</main>
<footer class="site-foot">
  <div class="wrap" id="foot"></div>
</footer>

<script type="application/json" id="playbook-data">/*DATA*/</script>
<script>
(function(){
  "use strict";
  var PRISTINE = "<!doctype html>\n" + document.documentElement.outerHTML;
  var SUPPORTER_LOGOS = /*SUPPORTER_LOGOS*/{};
  var framed = false;
  try { framed = window.self !== window.top; } catch (e){ framed = true; }
  // sandboxed previews (like Claude's panel) block downloads, so the button only appears on a real page
  var canSave = !framed;
  var D = JSON.parse(document.getElementById("playbook-data").textContent);
  var M = D.meta;
  // who the playbook belongs to (from playbook.config.json): wording only, with neutral fallbacks
  var O = D.org || {}, PB = D.playbook || {};
  var SERIES = M.series || PB.name || "Community Playbook";
  var TEAM = O.team || "the organisers";
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  var JOIN = O.join && O.join.url ? O.join : (M.links && M.links.linkedin ? {label: "Join us on LinkedIn", url: M.links.linkedin} : null);
  // template and draft show dashed boxes for anything still empty; example and final hide empty sections
  var SLOTS = M.status === "template" || M.status === "draft";
  var main = document.getElementById("main"), pageName = document.getElementById("page-name");
  var STAGES = {starting:"Just starting", growing:"Growing", established:"Established"};
  var byId = {}; D.challenges.forEach(function(c){ byId[c.id] = c; });
  var themeById = {}; D.themes.forEach(function(t){ themeById[t.id] = t; });

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]; }); }
  function safeUrl(u){ return /^https?:\/\//i.test(u || "") ? esc(u) : "#"; }
  function plural(n, one, many){ return n + " " + (n === 1 ? one : (many || one + "s")); }
  function list(nums){
    // "1, 2 and 5": reads naturally aloud as well as on screen
    if (nums.length === 1) return String(nums[0]);
    return nums.slice(0, -1).join(", ") + " and " + nums[nums.length - 1];
  }
  // meta.table_names gives a table a name instead of a number (an online table might write "Virtual").
  // It keeps its number for the ring and the counts, but reads as "the Virtual table" everywhere it's listed.
  var TNAMES = M.table_names || {};
  function tname(n){ return TNAMES[n] || TNAMES[String(n)] || ""; }
  function tablesText(t, lower){
    var nums = t.filter(function(n){ return !tname(n); });
    var names = t.filter(function(n){ return tname(n); }).map(function(n){ return "the " + tname(n) + " table"; });
    var s = nums.length ? (nums.length === 1 ? "Table " : "Tables ") + list(nums.map(String).concat(names)) : list(names);
    return (lower ? s.charAt(0).toLowerCase() : s.charAt(0).toUpperCase()) + s.slice(1);
  }

  // The ring is arrows from different directions meeting in one space.
  // Here each arrow is a table, so a theme's ring shows which tables raised it.
  function ring(tables, opts){
    opts = opts || {};
    var total = opts.total || M.tables, on = {}, out = "";
    // fewer tables leaves gaps in the ring, so each arrow gets bigger to keep it reading as one mark
    var k = total <= 6 ? 1.55 : total <= 9 ? 1.2 : 1;
    (tables || []).forEach(function(n){ on[n] = true; });
    for (var i = 0; i < total; i++){
      var r = i * 360 / total;
      out += '<g class="arrow" style="--i:' + i + ';--r:' + r + 'deg" transform="rotate(' + r + ') translate(0,-34)">' +
             '<path class="' + (on[i + 1] ? "on" : "off") + '" transform="scale(' + k + ')" d="M-7,-4 L0,4 L7,-4"/></g>';
    }
    var centre = opts.centre != null ? '<text y="' + (opts.sub ? -5 : 1) + '">' + esc(opts.centre) + '</text>' : "";
    if (opts.sub) centre += '<text class="sub" y="12">' + esc(opts.sub) + '</text>';
    return '<svg class="ring" viewBox="-50 -50 100 100" aria-hidden="true" focusable="false">' + out + centre + '</svg>';
  }

  var ICON_ARROW = '<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4 10h11M11 5.5l4.5 4.5-4.5 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_BULB = '<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 2.5a5.5 5.5 0 0 0-3.2 10c.5.4.7.9.7 1.5v.5h5v-.5c0-.6.2-1.1.7-1.5A5.5 5.5 0 0 0 10 2.5zM8 17.5h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_OK = '<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_NO = '<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';

  function chips(items){
    if (!items || !items.length) return "";
    return '<ul class="chips">' + items.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
  }
  function actionCount(){ return D.challenges.reduce(function(n, c){ return n + c.actions.length; }, 0); }

  /* ---------- Empty slots (template and draft) ---------- */

  // Where each piece of content comes from on the day. Mirrors the paper kit in forum-to-playbook.html.
  var FROM = {
    title: "From Sheet 1, “The one we’re tackling”. It’s also on the table’s tent card.",
    summary: "One or two sentences on why it’s hard, from Sheet 1 and the table lead’s voice note.",
    quote: "From the side sheet, Quotes column. Exact words, labelled by sector only.",
    helped: "From Sheet 2, Helped column. One line each, with who it worked for.",
    hindered: "From Sheet 2, Got in the way column. One line each, with who it was for.",
    lesson: "From Sheet 2, “If we did it again, we’d…”",
    question: "From the side sheet, Questions column.",
    resource: "From the side sheet, Resources column. Every link gets checked before publishing.",
    theme: "Every challenge from every table’s Sheet 1, grouped into themes. The ring lights up the tables that raised each one.",
    commitment: "From the commitment card stubs in the box by the door, with a name and organisation only if the person added them."
  };
  function slot(label, from){
    return '<div class="slot"><span class="slot-tag">To fill</span><b>' + esc(label) + '</b><span>' + esc(from) + '</span></div>';
  }
  function inlineSlot(text){ return '<span class="slot-inline">' + esc(text) + '</span>'; }
  // Source tags such as "T07 · Sheet 2" help the review against the paper; they never show once published
  var SHEET_LABEL = {S1:"Sheet 1", S2:"Sheet 2", S3:"Sheet 3", SS:"side sheet", V:"voice note"};
  function prettySrc(id){
    var m = /^T(\d+)\.(S1|S2|S3|SS|V)\b/.exec(id);
    if (m) return "T" + m[1] + " \u00b7 " + SHEET_LABEL[m[2]];
    return /^C\./.test(id) ? "Card stub" : id;
  }
  function srcTag(x){
    if (!SLOTS || !x || !x.src) return "";
    var ids = [].concat(x.src), seen = {}, out = [];
    ids.forEach(function(i){ var p = prettySrc(i); if (!seen[p]){ seen[p] = 1; out.push(p); } });
    if (x.via === "virtual") out = ["Virtual table, typed"];   // no card or photo to check it against
    return ' <span class="src-tag" title="' + esc(ids.join(", ")) + '">' + esc(out.join(", ")) + '</span>';
  }
  // questions and lessons can be plain strings (hand-written data) or {text, src} (from the ingest)
  function textOf(x){ return typeof x === "string" ? x : (x && x.text) || ""; }
  function titleOf(c){
    return c.title || tablesText(c.tables) + "’s challenge";
  }

  /* ---------- Views ---------- */


  // "Shared on the day" cards: what it is (a video or a website), where it lives, and which table shared it
  var ICON_WEB = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
  var ICON_VIDEO = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2.5" y="5" width="19" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/></svg>';
  function hostOf(u){ var m = /^https?:\/\/(?:www\.)?([^\/?#]+)/i.exec(u || ""); return m ? m[1] : ""; }
  function tablesOf(x){
    var t = {};
    [].concat(x.src || []).forEach(function(i){ var m = /^T(\d+)\./.exec(i); if (m) t[+m[1]] = 1; });
    return Object.keys(t).map(Number).sort(function(a, b){ return a - b; });
  }
  function resCard(r, c){
    var video = /youtube\.com|youtu\.be|vimeo\.com/i.test(r.url || "");
    var meta = [r.url ? (video ? "Video" : "Website") : "", r.source, r.url ? hostOf(r.url) : "No link given"].filter(Boolean).join(" · ");
    var t = tablesOf(r), from = t.length ? "Shared by " + tablesText(t, true) : "";
    var title = r.url ? '<a class="res-link" href="' + safeUrl(r.url) + '">' + esc(r.title) + '</a>' : esc(r.title);
    var whence = [from ? esc(from) : "", c ? 'From <a href="#' + esc(c.id) + '">' + esc(titleOf(c)) + '</a>' : ""].filter(Boolean).join(" · ");
    return '<li class="res-card"><span class="res-icon">' + (video ? ICON_VIDEO : ICON_WEB) + '</span>' +
      '<div class="res-body"><h3>' + title + '</h3><p class="res-meta">' + esc(meta) + '</p>' +
      (whence ? '<p class="res-from">' + whence + '</p>' : "") + srcTag(r) + '</div></li>';
  }

  function viewOverview(){
    var themes = D.themes.slice().sort(function(a, b){ return b.tables.length - a.tables.length; });
    var challengesFor = {};
    D.challenges.forEach(function(c){ (challengesFor[c.theme] = challengesFor[c.theme] || []).push(c); });

    var themeHtml = themes.map(function(t){
      var linked = (challengesFor[t.id] || []).map(function(c){
        return '<p class="go"><a href="#' + esc(c.id) + '">Read: ' + esc(titleOf(c)) + '</a></p>';
      }).join("");
      var heard = t.heard && t.heard.length ? '<p class="heard"><span class="muted">Heard: </span>' +
        t.heard.map(function(h){ return "<q>" + esc(h) + "</q>"; }).join(" ") + "</p>" : "";
      return '<li class="theme">' + ring(t.tables, {centre: t.tables.length}) +
        '<div><h3>' + esc(t.label) + '</h3><p class="tables">' + t.tables.length + " of " + M.tables + " tables · " + tablesText(t.tables) + '</p></div>' +
        heard + linked + '</li>';
    }).join("");
    if (!themes.length && SLOTS){
      themeHtml = [0, 1, 2].map(function(i){
        return '<li class="theme is-slot">' + ring([]) + '<div>' + slot("Theme " + (i + 1), i ? "Grouped from Sheet 1." : FROM.theme) + '</div></li>';
      }).join("");
    }

    var cards = D.challenges.slice().sort(function(a, b){ return b.tables.length - a.tables.length; }).map(function(c){
      var th = themeById[c.theme];
      var acts = c.actions.length ? plural(c.actions.length, "action") + " to try" : (SLOTS ? "Actions to fill" : "");
      return '<li class="card' + (c.title ? "" : " is-empty") + '">' +
        (th ? '<p class="eyebrow">' + esc(th.label) + '</p>' : (SLOTS ? '<p class="eyebrow">' + inlineSlot("Theme to fill") + '</p>' : "")) +
        '<h3><a href="#' + esc(c.id) + '">' + esc(titleOf(c)) + '</a></h3>' +
        (c.summary ? '<p>' + esc(c.summary) + '</p>' : (SLOTS ? '<p class="muted">Title, summary and everything else on this page come from this table’s sheets.</p>' : "")) +
        '<p class="foot">' + ring(c.tables) + '<span>' + tablesText(c.tables) + (acts ? ' · ' + acts : "") + '</span></p>' +
        (c.title ? '<span class="go" aria-hidden="true">Explore this challenge' + ICON_ARROW + '</span>' : "") +
        '</li>';
    }).join("");

    // "Heard on the day": side-sheet quotes and things written in quotation marks on the main sheets, all in one place
    var cById = {};
    D.challenges.forEach(function(c){ cById[c.id] = c; });
    var heard = (D.quotes || []).map(function(q){
      var c = cById[q.challenge], t = q.tables || [];
      var where = t.length > 1 ? "Written at " + tablesText(t, true) : t.length ? tablesText(t) : "";
      var cap = [where, c ? '<a href="#' + esc(c.id) + '">' + esc(titleOf(c)) + '</a>' : ""].filter(Boolean).join(" · ") + srcTag(q);
      return '<li><figure class="quote"><blockquote><p>' + esc(q.text) + '</p></blockquote>' + (cap ? '<figcaption>' + cap + '</figcaption>' : "") + '</figure></li>';
    }).join("");

    var counts = [[D.themes.length, "themes"], [D.challenges.filter(function(c){ return c.title; }).length, "challenges"],
      [actionCount(), "actions"], [D.commitments.length, "commitments"]].filter(function(x){ return x[0] > 0; });

    // "Shared on the day": every resource in one place (general reading, then any tied to a challenge). One list
    // copes when only a few tables use a side sheet, where a page per challenge would be mostly empty.
    var shared = (D.resources || []).map(function(r){ return resCard(r); }).join("") + D.challenges.map(function(c){
      return (c.resources || []).map(function(r){ return resCard(r, c); }).join("");
    }).join("");

    var H_ = M.hero && M.hero.src ? M.hero : null;
    return '<section class="hero" aria-labelledby="hero-h">' +
      (H_ ? '<figure class="hero-photo"><img src="' + H_.src + '" alt="' + esc(H_.alt) + '" width="' + H_.width + '" height="' + H_.height + '"></figure>' : "") +
      '<div class="wrap"><div>' +
        '<p class="eyebrow">' + esc(M.series) + '</p>' +
        '<h1 id="hero-h" tabindex="-1">' + esc(M.title) + '</h1>' +
        '<p class="lede">Created from data collected during the ' + esc(O.forum || "community forum") + ' at ' + esc(M.event) + '.</p>' +
        (counts.length ? '<ul class="counts" aria-label="In this playbook">' + counts.map(function(x){ return '<li><b>' + x[0] + '</b> ' + x[1] + '</li>'; }).join("") + '</ul>' : "") +
        '<a class="btn" href="#challenges">Go to the challenges</a>' +
      '</div>' +
      '<div class="hero-ring">' + ring(range(Math.max(M.tables, 8)), {total: Math.max(M.tables, 8)}) + '</div>' +
      '</div></section>' +

      (themeHtml ? '<section class="section" aria-labelledby="themes-h"><div class="wrap">' +
        '<div class="section-head"><h2 id="themes-h">Where support gets stuck</h2>' +
        '<p>Every table listed the challenges its members face. These are the themes that came up, and which tables raised them. Each ring is the room: one arrow per table.</p></div>' +
        '<ul class="themes">' + themeHtml + '</ul>' +
      '</div></section>' : "") +

      '<section class="section" aria-labelledby="challenges-h"><div class="wrap">' +
        '<div class="section-head"><h2 id="challenges-h" tabindex="-1">The challenges</h2>' +
        '<p>Each table picked one challenge and worked through what has helped, what hasn’t, and what to try next. Where two tables picked the same challenge, their work is combined. Open any challenge to see the full detail.</p></div>' +
        '<ul class="cards' + (D.challenges.length % 2 ? " odd" : "") + '">' + cards + '</ul>' +
      '</div></section>' +

      (heard ? '<section class="section" aria-labelledby="heard-h"><div class="wrap">' +
        '<div class="section-head"><h2 id="heard-h">Heard on the day</h2>' +
        '<p>Things people said and wrote at the tables, word for word. No names: the forum ran under the Chatham House Rule.</p></div>' +
        '<ul class="quotes heard">' + heard + '</ul>' +
      '</div></section>' : "") +

      (shared ? '<section class="section" aria-labelledby="shared-h"><div class="wrap">' +
        '<div class="section-head"><h2 id="shared-h" tabindex="-1">Shared on the day</h2>' +
        '<p>Links, tools and reading people recommended to each other on the tables’ side sheets.</p></div>' +
        '<ul class="res-grid">' + shared + '</ul>' +
      '</div></section>' : "") +

      (JOIN ? '<section class="section join" aria-labelledby="join-h"><div class="wrap">' +
        '<h2 id="join-h">Join the conversation</h2>' +
        (O.about ? '<p>' + esc(O.about) + '</p>' : "") +
        '<a class="btn" href="' + safeUrl(JOIN.url) + '">' + esc(JOIN.label) + '</a>' +
      '</div></section>' : "");
  }

  function range(n){ var a = []; for (var i = 1; i <= n; i++) a.push(i); return a; }

  function commitCard(c){
    var ch = c.challenge && byId[c.challenge];
    // name and organisation appear only when the person chose to write them on their card
    var by = [c.name, c.org].filter(Boolean).join(", ");
    return '<li class="commit"><p><q>' + esc(c.text) + '</q>' + srcTag(c) + '</p>' +
      (by ? '<p class="by">By ' + esc(by) + '</p>' : "") +
      (ch ? '<a href="#' + esc(ch.id) + '">' + esc(titleOf(ch)) + '</a>' : '<span class="tag">General</span>') + '</li>';
  }

  function viewChallenge(c){
    var idx = D.challenges.indexOf(c);
    var prev = D.challenges[idx - 1], next = D.challenges[idx + 1];
    var th = themeById[c.theme];
    var ctx = [].concat(c.context && c.context.sectors || [], c.context && c.context.sizes || []);

    var quotes = (c.quotes || []).map(function(q){
      var cap = (q.who ? esc(q.who) : "") + srcTag(q);
      return '<figure class="quote"><blockquote><p>' + esc(q.text) + '</p></blockquote>' + (cap ? '<figcaption>' + cap + '</figcaption>' : "") + '</figure>';
    }).join("");
    if (!quotes && SLOTS) quotes = slot("Quote", FROM.quote) + slot("Quote", FROM.quote);

    function triedList(items, label, from){
      if (!items.length) return SLOTS ? '<ul><li class="is-slot">' + slot(label, from) + '</li></ul>' : "";
      return '<ul>' + items.map(function(x){
        return '<li>' + esc(x.text) + srcTag(x) + '</li>';
      }).join("") + '</ul>';
    }

    var lessons = (c.lessons || []).length ? '<div class="learned"><h3>' + ICON_BULB + 'What we learned</h3><ul class="lessons">' +
      c.lessons.map(function(l){ return '<li>' + esc(textOf(l)) + srcTag(l) + '</li>'; }).join("") + '</ul></div>' : "";
    if (!lessons && SLOTS) lessons = '<div class="lesson-slot">' + slot("What we learned", FROM.lesson) + '</div>';

    var filter = c.actions.length ? '<fieldset class="filter"><legend>Show actions for</legend>' +
      [["all", "Any stage"]].concat(Object.keys(STAGES).map(function(k){ return [k, STAGES[k]]; })).map(function(o, i){
        // the pill text names the radio through aria-labelledby and is hidden itself, or VoiceOver stops on both
        return '<label for="stage-' + o[0] + '"><input type="radio" name="stage" id="stage-' + o[0] + '" value="' + o[0] + '" aria-labelledby="stage-' + o[0] + '-text"' + (i === 0 ? " checked" : "") + '>' +
          '<span id="stage-' + o[0] + '-text" aria-hidden="true">' + esc(o[1]) + '</span></label>';
      }).join("") + '</fieldset>' +
      '<p class="status" id="action-status" role="status" aria-live="polite">' + showing(c.actions.length, c.actions.length) + '</p>' : "";

    var actions = c.actions.map(function(a, i){
      return '<li class="action" data-stages="' + esc((a.stages || []).join(" ")) + '"><h3>' + esc(a.title) + srcTag(a) + '</h3><dl>' +
        '<dt>What to do</dt><dd>' + esc(a.what) + '</dd>' +
        '<dt>What you need</dt><dd>' + esc(a.needs) + '</dd>' +
        '<dt>How it sticks</dt><dd>' + esc(a.sticks) + '</dd></dl>' +
        ((a.stages || []).length ? '<div class="goodfor"><span id="gf-' + esc(c.id) + '-' + i + '">Good for</span><ul class="chips" aria-labelledby="gf-' + esc(c.id) + '-' + i + '">' + a.stages.map(function(s){ return '<li>' + esc(STAGES[s] || s) + '</li>'; }).join("") + '</ul></div>' : "") +
        '</li>';
    }).join("");
    if (!actions && SLOTS){
      // one empty card per action box on Sheet 3, so the page mirrors the paper
      actions = [1, 2, 3].map(function(n){
        return '<li class="action is-slot"><span class="slot-tag">To fill</span><h3>Action ' + n + '</h3><dl>' +
          '<dt>What to do</dt><dd>From Sheet 3, the action box.</dd>' +
          '<dt>What you need</dt><dd>From Sheet 3, “What you need”.</dd>' +
          '<dt>How it sticks</dt><dd>From Sheet 3, “How it sticks”.</dd></dl>' +
          '<div class="goodfor"><span>Good for</span>' + inlineSlot("The ticks on Sheet 3") + '</div></li>';
      }).join("");
    }

    var hasQ = (c.questions || []).length;
    var questions = hasQ || SLOTS ? '<section class="block" aria-labelledby="q-h"><h2 id="q-h">Still open</h2><p class="muted" style="margin:-8px 0 16px">Questions the table didn’t answer. If you have, tell ' + esc(O.short || TEAM) + '.</p>' +
      (hasQ ? '<ul class="qlist">' + c.questions.map(function(q){ return '<li>' + esc(textOf(q)) + srcTag(q) + '</li>'; }).join("") + '</ul>' : slot("Open questions", FROM.question)) + '</section>' : "";

    var hasR = (c.resources || []).length;
    var resources = hasR || SLOTS ? '<section class="block" aria-labelledby="r-h"><h2 id="r-h">Resources</h2>' +
      (hasR ? '<ul class="links">' + c.resources.map(linkItem).join("") + '</ul>' : slot("Resources", FROM.resource)) + '</section>' : "";

    return '<div class="wrap">' +
      '<div class="page-head">' +
        '<p class="crumb"><a href="#challenges">← All challenges</a></p>' +
        (th ? '<p class="eyebrow">' + esc(th.label) + '</p>' : (SLOTS ? '<p class="eyebrow">' + inlineSlot("Theme to fill") + '</p>' : "")) +
        '<h1 tabindex="-1">' + esc(titleOf(c)) + '</h1>' +
        (!c.title && SLOTS ? slot("Challenge title", FROM.title) : "") +
        '<div class="meta">' + ring(c.tables) + '<span>Worked on at ' + tablesText(c.tables, true) + '</span>' +
          (ctx.length ? chips(ctx) : (SLOTS ? inlineSlot("Sectors and sizes, from Sheet 2") : "")) + '</div>' +
        (c.summary ? '<p class="summary">' + esc(c.summary) + '</p>' : (SLOTS ? slot("Why it’s hard", FROM.summary) : "")) +
      '</div>' +
      (quotes ? '<div class="quotes' + ((c.quotes || []).length !== 1 ? " two" : "") + '">' + quotes + '</div>' : "") +
      '<section class="block" aria-labelledby="t-h"><h2 id="t-h">What’s been tried</h2>' +
        '<div class="tried">' +
          '<div class="ok"><h3>' + ICON_OK + 'Helped</h3>' + triedList(c.helped || [], "What helped", FROM.helped) + '</div>' +
          '<div class="no"><h3>' + ICON_NO + 'Got in the way</h3>' + triedList(c.hindered || [], "What got in the way", FROM.hindered) + '</div>' +
        '</div>' + lessons +
      '</section>' +
      '<section class="block" aria-labelledby="a-h"><h2 id="a-h">Actions to try</h2>' + filter +
        '<ul class="actions" id="action-list">' + actions + '</ul>' +
      '</section>' +
      questions + resources +
      '<nav class="pager" aria-label="Other challenges">' +
        (prev ? '<a class="prev" href="#' + esc(prev.id) + '"><span>Previous challenge</span><b>' + esc(titleOf(prev)) + '</b></a>' : "<span></span>") +
        (next ? '<a class="next" href="#' + esc(next.id) + '"><span>Next challenge</span><b>' + esc(titleOf(next)) + '</b></a>' : "") +
      '</nav>' +
    '</div>';
  }

  function showing(n, total){
    return n === total ? "Showing all " + plural(total, "action") + "." :
      (n === 0 ? "No actions from this table were marked for this stage. Choose another stage." : "Showing " + n + " of " + plural(total, "action") + ".");
  }

  function linkItem(r){
    // a resource someone named without writing an address is still worth listing: as text, never a dead link
    var title = r.url ? '<a href="' + safeUrl(r.url) + '">' + esc(r.title) + '</a>' : '<span class="nolink">' + esc(r.title) + '</span>';
    return '<li>' + title + (r.source ? '<span class="src">' + esc(r.source) + '</span>' : "") + srcTag(r) +
      (SLOTS && !r.url ? ' <span class="src-tag">No link yet</span>' : "") + '</li>';
  }

  function viewCommitments(){
    var head = '<div class="wrap"><div class="page-head">' +
      '<p class="eyebrow">Commitments</p>' +
      '<h1 tabindex="-1">One thing I will try, adapt or explore</h1>' +
      '<p class="summary">At the end of the session, everyone wrote one commitment on a card. Some linked it to a challenge, and some added their name.</p></div>';
    if (!D.commitments.length){
      return head + (SLOTS ? '<ul class="commits">' + [0, 1, 2, 3].map(function(){ return '<li class="commit is-slot">' + slot("Commitment", FROM.commitment) + '</li>'; }).join("") + '</ul>' : "") + '</div>';
    }
    var opts = '<option value="all">All commitments (' + D.commitments.length + ')</option>' +
      D.challenges.map(function(c){
        var n = D.commitments.filter(function(x){ return x.challenge === c.id; }).length;
        return n ? '<option value="' + esc(c.id) + '">' + esc(titleOf(c)) + ' (' + n + ')</option>' : "";
      }).join("");
    var general = D.commitments.filter(function(x){ return !x.challenge; }).length;
    if (general) opts += '<option value="general">General (' + general + ')</option>';
    return head +
      '<div class="select"><label for="commit-filter">Show</label><select id="commit-filter">' + opts + '</select>' +
      '<span class="status" id="commit-status" role="status" aria-live="polite" style="margin:0"></span></div>' +
      '<ul class="commits" id="commit-list">' + D.commitments.map(function(c){
        return commitCard(c).replace('<li class="commit"', '<li class="commit" data-challenge="' + esc(c.challenge || "general") + '"');
      }).join("") + '</ul></div>';
  }

  /* ---------- Run your own: the plan for the hour, every sheet as text, and the print files ---------- */
  var KIT_HOUR = [
    ["Before", "", "Set-up and arrivals", "Put a kit on every table: the four sheets, a commitment card per person, a table card, thick black markers and sticky notes. Test the slides and clicker. Table leads write their table number on every sheet."],
    ["0 to 10 minutes", "10 minutes", "Welcome", "Who you are, and the playbook you’ll make from the tables. How it gets made: sheets, photos, people check every line. Chatham House Rule, and nobody has to write."],
    ["10 to 22 minutes", "12 minutes", "Question 1: Where does support get stuck?", "7 minutes to list every challenge and star the top three, then pick one to tackle. 5 minutes with the table card up: tables share what they’re tackling, and anyone can move tables."],
    ["22 to 35 minutes", "13 minutes", "Question 2: What has helped, or not?", "What helped, what got in the way, and what you’d do next time, about the challenge on the table card."],
    ["35 to 50 minutes", "15 minutes", "Question 3: What could people try now, and how does it stick?", "Up to three actions: what to try, what you need, how it sticks. Tick who each one is good for."],
    ["50 to 55 minutes", "5 minutes", "Question 4: One thing I will try, adapt or explore", "Everyone writes a commitment on both halves of their card, tears it, keeps the half with the QR code and leaves the other half on the table."],
    ["55 to 60 minutes", "5 minutes", "Share-back and close", "Tables share an action each, as time allows. Skip it if you’re running late."],
    ["After", "About 30 minutes", "Capture", "Photograph every sheet with the table number in shot (sheets only, never people), and collect the card halves."]
  ];
  var KIT_SHEETS = [
    ["Sheet 1 · Question 1", "Where does support get stuck?", [
      ["Who’s at this table?", "Everyone puts one tally mark against their sector, and writes their country. Sectors: Public sector, Finance, Retail, Tech, Education, Charity, Health, Other. Then a line for Countries."],
      ["Every challenge at this table", "Write them all down. Budget, leadership, burnout, proving impact…"],
      ["Our top three", "Three numbered lines."],
      ["The one we’re tackling", "Copy it onto your table card too."]]],
    ["Sheet 2 · Question 2", "What has helped, or not?", [
      ["Helped", "What happened, and why did it work?"],
      ["Got in the way", "What would you change or avoid?"],
      ["If we did it again, we’d…", ""]]],
    ["Sheet 3 · Question 3", "What could people try now, and how does it stick?", [
      ["Action 1, Action 2 and Action 3", "Each has three columns, What to try, What you need and How it sticks, and tick boxes: Good for Just starting, Growing, Established."]]],
    ["Side sheet · All session", "Heard something good? Write it here.", [
      ["Quotes", "Exact words, no names"],
      ["Questions", "Things nobody could answer"],
      ["Resources", "Links, books, people, tools"],
      ["Best thing said today", "The table lead writes it in the last two minutes."]]],
    ["Commitment card · Question 4", "One thing I will try, adapt or explore is…", [
      ["Both halves", "The same prompt and writing lines on each half. People write their commitment on both, tear along the perforation and keep one."],
      ["The half you keep", "A QR code and “Scan for the " + SERIES + ": what every table came up with.”"],
      ["The half you leave", "Name (optional) and Organisation (optional): “Add these only if you’re happy for them to appear in the public playbook.”"]]],
    ["Table card", "Folds into a tent", [
      ["One side", "The table number."],
      ["The other side", "“We’re tackling:” with lines to write the table’s challenge, so the room can see it."]]]
  ];
  var KIT_PROMPTS = [
    ["Question 1", ["What would you fix first if you could?", "What makes support drop off after a good start?", "What does your boss ask that you can’t answer?"]],
    ["Question 2", ["Tell me about a time it worked. What was different?", "What would you never try again?", "What made the difference?"]],
    ["Question 3", ["What could someone do on Monday?", "What would they need to make it happen?", "What stops it fading after a month?"]],
    ["Question 4", ["Make it small enough to start this month. What’s one thing you heard today that you could try?"]]
  ];
  function viewKit(){
    function kitList(group){
      return (D.kit || []).filter(function(f){ return (f.group || "print") === group; }).map(function(f){
        // web pages open in the browser; PDFs and zips download
        var dl = f.kind === "web page" ? "" : " download";
        return '<li><a href="' + esc(f.href) + '"' + dl + '>' + esc(f.title) + ' (' + esc(f.kind) + ', ' + esc(f.size) + ')</a><span class="src">' + esc(f.note) + '</span></li>';
      }).join("");
    }
    var slides = kitList("slides"), webSheets = kitList("html"), files = kitList("print");
    // the kit and the tools that built this site, as an open-source project (kit.source in the settings, or meta.links.source)
    var SOURCE = M.links && M.links.source ? safeUrl(M.links.source) : "";
    var licence = M.kit_licence ? '<p class="summary">' + esc(M.kit_licence) + (SLOTS ? ' <span class="src-tag">Check the licence wording</span>' : "") + '</p>' : "";
    return '<div class="wrap"><div class="page-head">' +
      '<p class="eyebrow">Run your own</p>' +
      '<h1 tabindex="-1">Run your own forum</h1>' +
      '<p class="summary">Everything used to run this session: the plan for the hour, what’s on each sheet, prompts for when a table gets stuck, and the print files. Take it, change it, make it yours.</p>' + licence +
      (SOURCE ? '<p><a class="btn" href="' + SOURCE + '">Get the whole kit on GitHub</a></p>' : "") +
      '</div>' +
      '<section class="block" aria-labelledby="kit-hour"><h2 id="kit-hour">The hour, in seven parts</h2>' +
        '<ol class="kit-hour">' + KIT_HOUR.map(function(r){
          return '<li><h3>' + esc(r[2]) + '</h3><p class="when">' + esc(r[0]) + (r[1] ? " · " + esc(r[1]) : "") + '</p><p>' + esc(r[3]) + '</p></li>';
        }).join("") + '</ol></section>' +
      (slides ? '<section class="block" aria-labelledby="kit-slides"><h2 id="kit-slides">The slides</h2>' +
        '<p>The deck used on the day, with a slide and a timer for each question and the facilitator’s notes and prompts. Change anything you like.</p>' +
        '<ul class="links">' + slides + '</ul></section>' : "") +
      '<section class="block" aria-labelledby="kit-sheets"><h2 id="kit-sheets">What’s on each sheet</h2>' +
        '<p>The sheets are A1 posters, one per question, plus a side sheet that stays out all session. Here’s every word on them, to copy into your own versions.</p>' +
        '<div class="kit-sheets">' + KIT_SHEETS.map(function(sh){
          return '<section class="kit-sheet" aria-label="' + esc(sh[0]) + '"><p class="eyebrow">' + esc(sh[0]) + '</p><h3>' + esc(sh[1]) + '</h3><dl>' +
            sh[2].map(function(z){ return '<dt>' + esc(z[0]) + '</dt>' + (z[1] ? '<dd>' + esc(z[1]) + '</dd>' : ""); }).join("") + '</dl></section>';
        }).join("") + '</div>' +
        '<p class="note">Every sheet’s footer says: “All of this goes into the ' + esc(SERIES) + '. No names, please.”</p>' +
        (webSheets ? '<h3 class="kit-sub">Each sheet as a web page</h3><p>Every sheet and card as a page you can type into, print on A4, or save and change. They work with a screen reader, and suit an online table too.</p>' +
          '<ul class="links">' + webSheets + '</ul>' : "") +
      '</section>' +
      '<section class="block" aria-labelledby="kit-prompts"><h2 id="kit-prompts">If a table gets stuck</h2>' +
        '<div class="kit-prompts">' + KIT_PROMPTS.map(function(q){
          return '<div><h3>' + esc(q[0]) + '</h3><ul>' + q[1].map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></div>';
        }).join("") + '</div></section>' +
      '<section class="block" aria-labelledby="kit-files"><h2 id="kit-files">Print files</h2>' +
        (files ? '<ul class="links">' + files + '</ul>' : (SLOTS ? slot("Print files", "Added from print/out when the playbook is built.") : "<p>Ask " + esc(TEAM) + " for the print files.</p>")) +
        '<p class="note">These are ready for a professional printer: CMYK, with 3 mm bleed. The lettering is turned into outlines for the printer, so screen readers can’t read these PDFs: the text of every sheet is above. The commitment card’s QR code points to this playbook, so swap in your own.</p>' +
      '</section>' +
      '<section class="block" aria-labelledby="kit-after"><h2 id="kit-after">Turning the sheets into a playbook</h2>' +
        '<p>Photograph every sheet, transcribe it, and check every line against the photos before anything goes live. <a href="#about">How this playbook was made</a> describes how we did it.</p>' +
        (SOURCE ? '<p>The tools are free and open source: the paper kit, the slides, and the Claude Code skill that reads the photos and builds the site, with checks that stop it adding anything that wasn’t written down. You can rebrand all of it with your own name and colours. <a href="' + SOURCE + '">sheets-to-playbook on GitHub</a> has everything, with a guide to running it on the day.</p>' : "") +
        '</section>' +
      '</div>';
  }

  function viewAbout(){
    return '<div class="wrap"><div class="page-head">' +
      '<p class="eyebrow">About this playbook</p>' +
      '<h1 tabindex="-1">How this playbook was made</h1></div>' +
      '<div class="prose">' +
        '<p>This playbook was written by the people in the room at the ' + esc(O.forum || "community forum") + ' at ' + esc(M.event) + ' on ' + esc(M.date) + ', ' + esc(M.time) + '. People came from different organisations, sectors and stages: some just starting out, some working alone, some running established programmes.</p>' +
        '<h2>From the tables to this page</h2>' +
        '<ol class="steps">' +
          '<li>Each of the ' + M.tables + ' tables worked through four questions on large printed sheets: where support gets stuck, what has helped or not, what to try next, and one personal commitment.</li>' +
          '<li>A separate sheet on every table collected good quotes, open questions and resources as they came up.</li>' +
          '<li>After the session, ' + esc(TEAM) + ' photographed every sheet.</li>' +
          '<li>Claude, an AI model, transcribed the sheets and grouped the challenges into themes. It was told not to add anything that wasn’t written down, and to flag anything it couldn’t read.</li>' +
          '<li>' + esc(cap(TEAM)) + ' checked every entry against the original sheets before publishing.</li>' +
        '</ol>' +
        '<h2>Who said what</h2>' +
        '<p>The session ran under the Chatham House Rule. Nothing from the table discussions is linked to a named person or organisation. Commitments show a name only where someone chose to add one.</p>' +
        (O.about ? '<h2>About ' + esc(O.short || O.name) + '</h2><p>' + esc(O.about) + '</p>' : "") +
        '<h2>Keep a copy</h2>' +
        '<p>This playbook is a single web page that works offline, so you can keep it, share it or open it without an internet connection.</p>' +
        (canSave ? '<p><button type="button" class="save-btn" data-save>Download this playbook</button></p>' : "") +
      '</div></div>';
  }

  /* ---------- Router ---------- */

  var VIEWS = {overview:[viewOverview, "Playbook"], commitments:[viewCommitments, "Commitments"], about:[viewAbout, "How it was made"], kit:[viewKit, "Run your own"]};
  var first = true;

  // The page keeps its own idea of the current view. Previews that load the file in a sandboxed
  // frame (srcdoc) resolve "#x" links against the host's address, so native hash navigation
  // goes nowhere there; links are handled in script and the URL is updated only where allowed.
  function keyFromHash(){ var h = ""; try { h = location.hash || ""; } catch (e){} return h.slice(1) || "overview"; }
  var current = keyFromHash();
  function go(key){
    current = key;
    try { history.pushState(null, "", "#" + key); } catch (e){}
    route();
  }

  function route(){
    var key = current;
    var target = null;
    // #challenges is the overview scrolled to its challenge list, so it can be linked to directly
    if (key === "challenges"){ key = "overview"; target = "challenges-h"; }
    if (key === "resources"){ key = "overview"; target = "shared-h"; }   // the old Resources page now lives on the overview
    var c = byId[key], html, label, nav;
    if (c){ html = viewChallenge(c); label = titleOf(c); nav = "overview"; }
    else {
      if (!VIEWS[key]) key = "overview";
      html = VIEWS[key][0](); label = VIEWS[key][1]; nav = key;
    }
    main.innerHTML = html;
    document.title = (label === "Playbook" ? "" : label + " · ") + SERIES;
    [].forEach.call(document.querySelectorAll("[data-nav]"), function(a){
      if (a.getAttribute("data-nav") === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    wire(c);
    if (target) jump(target);
    else if (!first){
      // Behave like a page load: start at the very top and say which page this is. Focusing the h1
      // skipped whatever sits above it (the back link, the theme label). The skip link is the next stop.
      window.scrollTo(0, 0);
      pageName.textContent = (label === "Playbook" ? "" : label + ", ") + SERIES;
      pageName.focus({preventScroll:true});
    }
    first = false;
  }

  function wire(c){
    if (c && document.getElementById("action-status")){
      var list = document.getElementById("action-list"), status = document.getElementById("action-status");
      [].forEach.call(main.querySelectorAll('input[name="stage"]'), function(r){
        r.addEventListener("change", function(){
          var v = r.value, shown = 0;
          [].forEach.call(list.children, function(li){
            var ok = v === "all" || (" " + li.getAttribute("data-stages") + " ").indexOf(" " + v + " ") > -1;
            li.hidden = !ok; if (ok) shown++;
          });
          status.textContent = showing(shown, list.children.length);
        });
      });
    }
    var sel = document.getElementById("commit-filter");
    if (sel){
      var cl = document.getElementById("commit-list"), cs = document.getElementById("commit-status");
      sel.addEventListener("change", function(){
        var shown = 0;
        [].forEach.call(cl.children, function(li){
          var ok = sel.value === "all" || li.getAttribute("data-challenge") === sel.value;
          li.hidden = !ok; if (ok) shown++;
        });
        cs.textContent = sel.value === "all" ? "Showing all " + plural(shown, "commitment") + "." : "Showing " + plural(shown, "commitment") + ".";
      });
    }
  }

  function jump(id){
    var el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({block:"start"});
    el.focus({preventScroll:true});
  }

  /* ---------- Chrome ---------- */

  var BANNERS = {
    template: ["Template.", "Dashed boxes show where content from the day goes and which sheet it comes from. There\u2019s one page per table; tables that pick the same challenge get merged."],
    draft: ["Draft for review.", "Dashed boxes are still empty, and tags like T07 \u00b7 Sheet 2 show where each line came from. Both disappear when the playbook is published."]
  };
  // meta.banner lets a particular data file explain itself, e.g. a test run built from fake sheets
  var banner = M.banner || BANNERS[M.status];
  if (banner){
    document.getElementById("banner").innerHTML = '<div class="example" role="note"><div class="wrap"><strong>' + esc(banner[0]) + '</strong><span>' + esc(banner[1]) + '</span></div></div>';
  }
  // The example keeps a quiet marker instead of a banner: its quotes are invented, so it must never pass for the real thing
  if (M.status === "example"){
    document.querySelector(".site-head .wrap").insertAdjacentHTML("beforeend", '<p class="example-pill">Example, not from the session</p>');
  }

  var supporters = (M.supporters || []).map(function(sp){
    var logo = SUPPORTER_LOGOS[sp.logo];
    var inner = logo ? '<img class="logo-light" src="' + logo.light + '" alt="' + esc(sp.name) + '">' +
      (logo.dark ? '<img class="logo-dark" src="' + logo.dark + '" alt="' + esc(sp.name) + '">' : "") : esc(sp.name);
    return '<li><a href="' + safeUrl(sp.url) + '"' + (logo ? ' class="has-logo"' : "") + '>' + inner + '</a></li>';
  }).join("");
  // the "Built with" line from the settings (already HTML); an older session's own meta.credit if the settings' is off
  var CREDIT = D.credit_html || (M.credit ? esc(M.credit) : "");
  var SAVE = canSave ? '<button type="button" class="save-link" data-save>Download this playbook</button>' : "";
  var FILE_NAME = D.file_name || "playbook.html";
  document.getElementById("foot").innerHTML =
    (supporters ? '<div class="supporters"><p>Supported by</p><ul>' + supporters + '</ul></div>' : "") +
    '<div class="foot-meta"><p>' + esc(M.series) + ': ' + esc(M.title) + ' · ' + esc(M.edition) + '</p>' +
    '<p>' + SAVE + (SAVE && CREDIT ? ' · ' : "") + CREDIT + '</p>' +
    '<p class="save-status" id="save-status" role="status" aria-live="polite"></p></div>';

  // Download a copy of the page as it was served (before any view was drawn), so the file opens and works offline.
  // A blob link with a file name behaves the same in every browser; a plain download link to the page didn't always.
  document.addEventListener("click", function(e){
    var b = e.target.closest && e.target.closest("[data-save]");
    if (!b) return;
    var status = document.getElementById("save-status");
    try {
      var url = URL.createObjectURL(new Blob([PRISTINE], {type: "text/html"}));
      var a = document.createElement("a");
      a.href = url; a.download = FILE_NAME; a.hidden = true;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      status.textContent = "Downloading " + FILE_NAME + ". It opens in any browser, even offline.";
    } catch (err){
      status.textContent = "Your browser blocked the download. Use its Save or Share option instead.";
    }
  });

  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    // leave modified clicks alone so "open in new tab" still works where the page has a real URL
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    if (a.id === "skip"){
      // a #main hash would be read as a page name, so move focus without touching the URL
      var h = main.querySelector("h1") || main;
      h.focus({preventScroll:true}); h.scrollIntoView({block:"start"});
      return;
    }
    go(a.getAttribute("href").slice(1));
  });
  function fromUrl(){ var k = keyFromHash(); if (k !== current){ current = k; route(); } }
  window.addEventListener("hashchange", fromUrl);
  window.addEventListener("popstate", fromUrl);
  route();
})();
</script>
</body>
</html>
